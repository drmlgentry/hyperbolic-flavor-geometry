<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">Figure 2 — Disjoint ramification supports</title>
<desc id="desc">A pure mathematics diagram showing four Galois pieces with pairwise disjoint ramification supports at primes 3, 283, 7, and 59, and the resulting linear disjointness used in the compositum theorem.</desc>

<rect width="1500" height="900" fill="#f7f4ef"/>

<style>
.title { font-family:"EB Garamond",Georgia,serif; font-size:32px; font-weight:600; fill:#1a1a1a; }
.sub { font-family:"EB Garamond",Georgia,serif; font-size:17px; font-style:italic; fill:#5d574f; }
.head { font-family:"EB Garamond",Georgia,serif; font-size:30px; font-weight:600; fill:#1a1a1a; }
.body { font-family:"EB Garamond",Georgia,serif; font-size:26px; fill:#1a1a1a; }
.small { font-family:"EB Garamond",Georgia,serif; font-size:21px; fill:#5d574f; }
.mono { font-family:"JetBrains Mono","Courier New",monospace; font-size:25px; fill:#1a1a1a; }
.bigmono { font-family:"JetBrains Mono","Courier New",monospace; font-size:36px; font-weight:700; fill:#1a1a1a; }
.badge { font-family:"JetBrains Mono","Courier New",monospace; font-size:19px; font-weight:700; fill:#2a5e2a; }
.card { fill:#2a5e2a; fill-opacity:0.055; stroke:#2a5e2a; stroke-width:1.6; }
.prime { fill:#7b5a2e; fill-opacity:0.10; stroke:#7b5a2e; stroke-width:1.8; }
.result { fill:#8b2020; fill-opacity:0.045; stroke:#8b2020; stroke-width:1.8; }
.rule { stroke:#1a1a1a; stroke-width:1.4; }
.dash { stroke:#b8b2aa; stroke-width:1.2; stroke-dasharray:6 6; }
</style>

<!-- header -->
<text x="750" y="58" text-anchor="middle" class="title">FIGURE 2 — DISJOINT RAMIFICATION SUPPORTS</text>
<text x="750" y="91" text-anchor="middle" class="sub">The second proof of linear disjointness: the four Galois pieces ramify at different rational primes</text>

<!-- proved badge -->
<rect x="682" y="116" width="136" height="32" rx="16" fill="#2a5e2a" fill-opacity="0.10" stroke="#2a5e2a" stroke-width="1"/>
<text x="750" y="137" text-anchor="middle" class="badge">PROVED</text>

<!-- cards -->
<text x="75" y="195" class="head">Galois pieces and their ramification supports</text>

<rect x="70" y="225" width="300" height="245" rx="14" class="card"/>
<text x="220" y="267" text-anchor="middle" class="bigmono">K₁</text>
<text x="220" y="302" text-anchor="middle" class="mono">ℚ(√−3)</text>
<text x="220" y="342" text-anchor="middle" class="body">Galois group C₂</text>
<rect x="130" y="375" width="180" height="60" rx="30" class="prime"/>
<text x="220" y="413" text-anchor="middle" class="bigmono">{3}</text>

<rect x="420" y="225" width="300" height="245" rx="14" class="card"/>
<text x="570" y="267" text-anchor="middle" class="bigmono">L₂</text>
<text x="570" y="302" text-anchor="middle" class="mono">Galois closure of K₂</text>
<text x="570" y="342" text-anchor="middle" class="body">Galois group S₄</text>
<rect x="480" y="375" width="180" height="60" rx="30" class="prime"/>
<text x="570" y="413" text-anchor="middle" class="bigmono">{283}</text>

<rect x="780" y="225" width="300" height="245" rx="14" class="card"/>
<text x="930" y="267" text-anchor="middle" class="bigmono">K₃</text>
<text x="930" y="302" text-anchor="middle" class="mono">ℚ(√−7)</text>
<text x="930" y="342" text-anchor="middle" class="body">Galois group C₂</text>
<rect x="840" y="375" width="180" height="60" rx="30" class="prime"/>
<text x="930" y="413" text-anchor="middle" class="bigmono">{7}</text>

<rect x="1130" y="225" width="300" height="245" rx="14" class="card"/>
<text x="1280" y="267" text-anchor="middle" class="bigmono">L₄</text>
<text x="1280" y="302" text-anchor="middle" class="mono">Galois closure of K₄</text>
<text x="1280" y="342" text-anchor="middle" class="body">Galois group S₃</text>
<rect x="1190" y="375" width="180" height="60" rx="30" class="prime"/>
<text x="1280" y="413" text-anchor="middle" class="bigmono">{59}</text>

<!-- disjointness -->
<line x1="95" y1="515" x2="1405" y2="515" class="dash"/>
<text x="750" y="558" text-anchor="middle" class="head">Pairwise disjoint prime supports</text>
<text x="750" y="594" text-anchor="middle" class="mono">{3} ∩ {283} = {3} ∩ {7} = ··· = {7} ∩ {59} = ∅</text>

<!-- implication -->
<path d="M750 620 L750 674" stroke="#7b5a2e" stroke-width="2" fill="none"/>
<path d="M742 665 L750 678 L758 665" fill="none" stroke="#7b5a2e" stroke-width="2"/>

<rect x="250" y="685" width="1000" height="125" rx="15" class="result"/>
<text x="750" y="725" text-anchor="middle" class="head">No nontrivial common subextension</text>
<text x="750" y="758" text-anchor="middle" class="body">A common subfield would be unramified at every finite rational prime;</text>
<text x="750" y="786" text-anchor="middle" class="body">Minkowski's theorem rules out a nontrivial everywhere-unramified extension of ℚ.</text>

<!-- conclusion -->
<text x="750" y="846" text-anchor="middle" class="bigmono">⇒  K₁, L₂, K₃, L₄ are jointly linearly disjoint over ℚ</text>
<text x="750" y="876" text-anchor="middle" class="small">Together with Galoisness of each piece, this yields the direct-product Galois group in the main theorem.</text>
</svg>