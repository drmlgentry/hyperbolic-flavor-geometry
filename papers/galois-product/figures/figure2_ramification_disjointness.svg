<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1150" role="img" aria-labelledby="title desc">
<title id="title">Figure 2 — Disjoint ramification supports</title>
<desc id="desc">A pure mathematics diagram showing four Galois pieces with pairwise disjoint ramification supports at primes 3, 283, 7, and 59, and the resulting linear disjointness used in the compositum theorem.</desc>

<rect width="1500" height="1150" fill="#f7f4ef"/>

<style>
.title { font-family:"EB Garamond",Georgia,serif; font-size:34px; font-weight:600; fill:#1a1a1a; }
.sub { font-family:"EB Garamond",Georgia,serif; font-size:19px; font-style:italic; fill:#5d574f; }
.head { font-family:"EB Garamond",Georgia,serif; font-size:30px; font-weight:600; fill:#1a1a1a; }
.body { font-family:"EB Garamond",Georgia,serif; font-size:28px; fill:#1a1a1a; }
.small { font-family:"EB Garamond",Georgia,serif; font-size:22px; fill:#5d574f; }
.mono { font-family:"JetBrains Mono","Courier New",monospace; font-size:27px; fill:#1a1a1a; }
.bigmono { font-family:"JetBrains Mono","Courier New",monospace; font-size:40px; font-weight:700; fill:#1a1a1a; }
.badge { font-family:"JetBrains Mono","Courier New",monospace; font-size:21px; font-weight:700; fill:#2a5e2a; }
.card { fill:#2a5e2a; fill-opacity:0.055; stroke:#2a5e2a; stroke-width:1.8; }
.prime { fill:#7b5a2e; fill-opacity:0.10; stroke:#7b5a2e; stroke-width:2; }
.result { fill:#8b2020; fill-opacity:0.045; stroke:#8b2020; stroke-width:2; }
.rule { stroke:#1a1a1a; stroke-width:1.5; }
.dash { stroke:#b8b2aa; stroke-width:1.3; stroke-dasharray:6 6; }
</style>

<!-- header -->
<text x="750" y="55" text-anchor="middle" class="title">FIGURE 2 — DISJOINT RAMIFICATION SUPPORTS</text>
<text x="750" y="88" text-anchor="middle" class="sub">The second proof of linear disjointness: the four Galois pieces ramify at different rational primes</text>

<!-- proved badge -->
<rect x="655" y="112" width="190" height="42" rx="21" fill="#2a5e2a" fill-opacity="0.10" stroke="#2a5e2a" stroke-width="1.2"/>
<text x="750" y="140" text-anchor="middle" class="badge">PROVED</text>

<!-- cards -->
<text x="60" y="215" class="head">Galois pieces and their ramification supports</text>

<rect x="55" y="245" width="330" height="330" rx="16" class="card"/>
<text x="220" y="300" text-anchor="middle" class="bigmono">K₁</text>
<text x="220" y="345" text-anchor="middle" class="mono">ℚ(√−3)</text>
<text x="220" y="395" text-anchor="middle" class="body">Galois group C₂</text>
<rect x="115" y="450" width="210" height="90" rx="45" class="prime"/>
<text x="220" y="507" text-anchor="middle" class="bigmono">{3}</text>

<rect x="420" y="245" width="330" height="330" rx="16" class="card"/>
<text x="585" y="300" text-anchor="middle" class="bigmono">L₂</text>
<text x="585" y="345" text-anchor="middle" class="mono">Galois closure of K₂</text>
<text x="585" y="395" text-anchor="middle" class="body">Galois group S₄</text>
<rect x="465" y="450" width="240" height="90" rx="45" class="prime"/>
<text x="585" y="507" text-anchor="middle" class="bigmono">{283}</text>

<rect x="785" y="245" width="330" height="330" rx="16" class="card"/>
<text x="950" y="300" text-anchor="middle" class="bigmono">K₃</text>
<text x="950" y="345" text-anchor="middle" class="mono">ℚ(√−7)</text>
<text x="950" y="395" text-anchor="middle" class="body">Galois group C₂</text>
<rect x="845" y="450" width="210" height="90" rx="45" class="prime"/>
<text x="950" y="507" text-anchor="middle" class="bigmono">{7}</text>

<rect x="1150" y="245" width="330" height="330" rx="16" class="card"/>
<text x="1315" y="300" text-anchor="middle" class="bigmono">L₄</text>
<text x="1315" y="345" text-anchor="middle" class="mono">Galois closure of K₄</text>
<text x="1315" y="395" text-anchor="middle" class="body">Galois group S₃</text>
<rect x="1210" y="450" width="210" height="90" rx="45" class="prime"/>
<text x="1315" y="507" text-anchor="middle" class="bigmono">{59}</text>

<!-- disjointness -->
<line x1="75" y1="620" x2="1425" y2="620" class="dash"/>
<text x="750" y="670" text-anchor="middle" class="head">Pairwise disjoint prime supports</text>
<text x="750" y="712" text-anchor="middle" class="mono">{3} ∩ {283} = {3} ∩ {7} = ··· = {7} ∩ {59} = ∅</text>

<!-- implication -->
<path d="M750 745 L750 805" stroke="#7b5a2e" stroke-width="2.4" fill="none"/>
<path d="M738 793 L750 810 L762 793" fill="none" stroke="#7b5a2e" stroke-width="2.4"/>

<rect x="70" y="818" width="1360" height="160" rx="18" class="result"/>
<text x="750" y="865" text-anchor="middle" class="head">No nontrivial common subextension</text>
<text x="750" y="905" text-anchor="middle" class="body">A common subfield would be unramified at every finite rational prime;</text>
<text x="750" y="943" text-anchor="middle" class="body">Minkowski's theorem rules out a nontrivial everywhere-unramified extension of ℚ.</text>

<!-- conclusion -->
<text x="750" y="1035" text-anchor="middle" class="bigmono" font-size="34">⇒  K₁, L₂, K₃, L₄ are jointly linearly disjoint over ℚ</text>
<text x="750" y="1080" text-anchor="middle" class="small">Together with Galoisness of each piece, this yields the direct-product Galois group in the main theorem.</text>
</svg>
