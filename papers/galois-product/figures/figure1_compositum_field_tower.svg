<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1400" role="img" aria-labelledby="title desc">
<title id="title">Figure 1 — Compositum and Galois-closure tower</title>
<desc id="desc">Field diagram for the four base fields, their Galois closures, and the sequential composita of degrees 144, 288, and 576.</desc>
<rect width="1500" height="1400" fill="#f7f4ef"/>
<style>
.title{font-family:"EB Garamond",Georgia,serif;font-size:34px;font-weight:600;fill:#1a1a1a}
.sub{font-family:"EB Garamond",Georgia,serif;font-size:19px;font-style:italic;fill:#5d574f}
.head{font-family:"EB Garamond",Georgia,serif;font-size:30px;font-weight:600;fill:#1a1a1a}
.body{font-family:"EB Garamond",Georgia,serif;font-size:28px;fill:#1a1a1a}
.small{font-family:"EB Garamond",Georgia,serif;font-size:22px;fill:#5d574f}
.mono{font-family:"JetBrains Mono","Courier New",monospace;font-size:27px;fill:#1a1a1a}
.degree{font-family:"JetBrains Mono","Courier New",monospace;font-size:22px;fill:#7b5a2e;font-weight:700}
.field{fill:none;stroke:#1a1a1a;stroke-width:1.6}
.closure{fill:#2a5e2a;fill-opacity:.07;stroke:#2a5e2a;stroke-width:1.8}
.compositum{fill:#7b5a2e;fill-opacity:.08;stroke:#7b5a2e;stroke-width:1.9}
.top{fill:#8b2020;fill-opacity:.06;stroke:#8b2020;stroke-width:2.2}
.incl{stroke:#1a1a1a;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
.join{stroke:#7b5a2e;stroke-width:2;fill:none;marker-end:url(#arrowTan)}
.guide{stroke:#b8b2aa;stroke-width:1.2;stroke-dasharray:6 5;fill:none}
</style>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1a1a1a"/></marker>
<marker id="arrowTan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7b5a2e"/></marker>
</defs>
<text x="750" y="50" text-anchor="middle" class="title">FIGURE 1 — COMPOSITUM AND GALOIS-CLOSURE TOWER</text>
<text x="750" y="82" text-anchor="middle" class="sub">Sequential degree multiplication underlying the 576-element Galois group</text>

<!-- top: L -->
<rect x="440" y="118" width="620" height="175" rx="16" class="top"/>
<text x="750" y="168" text-anchor="middle" class="mono">L = K₁L₂K₃L₄</text>
<text x="750" y="207" text-anchor="middle" class="body">degree 576 = 288 × 2</text>
<text x="750" y="245" text-anchor="middle" class="mono">Gal(L/ℚ) ≅ C₂ × S₄ × C₂ × S₃</text>

<line x1="750" y1="340" x2="750" y2="293" class="join"/>
<text x="775" y="325" class="degree">adjoin K₃ · ×2</text>

<!-- L2L4K1 -->
<rect x="505" y="340" width="490" height="155" rx="14" class="compositum"/>
<text x="750" y="390" text-anchor="middle" class="mono">L₂L₄K₁</text>
<text x="750" y="430" text-anchor="middle" class="body">degree 288 = 144 × 2</text>

<line x1="750" y1="550" x2="750" y2="495" class="join"/>
<text x="775" y="530" class="degree">adjoin K₁ · ×2</text>

<!-- L2L4 -->
<rect x="530" y="550" width="440" height="150" rx="13" class="compositum"/>
<text x="750" y="598" text-anchor="middle" class="mono">L₂L₄</text>
<text x="750" y="638" text-anchor="middle" class="body">degree 144 = 24 × 6</text>

<line x1="580" y1="770" x2="695" y2="700" class="join"/>
<text x="565" y="745" class="degree">×6</text>
<line x1="1220" y1="770" x2="850" y2="700" class="join"/>
<text x="1080" y="742" class="degree">×24</text>

<text x="70" y="740" class="head">Individual Galois closures</text>

<!-- L2, L4 closures -->
<rect x="360" y="770" width="360" height="150" rx="12" class="closure"/>
<text x="540" y="818" text-anchor="middle" class="mono">L₂ = K̃₂</text>
<text x="540" y="858" text-anchor="middle" class="body">degree 24 · Gal ≅ S₄</text>

<rect x="1080" y="770" width="360" height="150" rx="12" class="closure"/>
<text x="1260" y="818" text-anchor="middle" class="mono">L₄ = K̃₄</text>
<text x="1260" y="858" text-anchor="middle" class="body">degree 6 · Gal ≅ S₃</text>

<line x1="540" y1="990" x2="540" y2="920" class="incl"/>
<text x="560" y="960" class="degree">[L₂:K₂]=6</text>
<line x1="1260" y1="990" x2="1260" y2="920" class="incl"/>
<text x="1280" y="960" class="degree">[L₄:K₄]=2</text>

<text x="70" y="975" class="head">Base fields</text>

<!-- base fields -->
<rect x="50" y="990" width="320" height="180" rx="12" class="field"/>
<text x="210" y="1050" text-anchor="middle" class="mono">K₁ = ℚ(√−3)</text>
<text x="210" y="1097" text-anchor="middle" class="body">degree 2 · Galois</text>

<rect x="390" y="990" width="340" height="180" rx="12" class="field"/>
<text x="560" y="1035" text-anchor="middle" class="mono">K₂ = ℚ(α)</text>
<text x="560" y="1072" text-anchor="middle" class="mono">α⁴ − α − 1 = 0</text>
<text x="560" y="1115" text-anchor="middle" class="body">degree 4 · non-Galois</text>

<rect x="770" y="990" width="320" height="180" rx="12" class="field"/>
<text x="930" y="1050" text-anchor="middle" class="mono">K₃ = ℚ(√−7)</text>
<text x="930" y="1097" text-anchor="middle" class="body">degree 2 · Galois</text>

<rect x="1130" y="990" width="340" height="180" rx="12" class="field"/>
<text x="1300" y="1035" text-anchor="middle" class="mono">K₄ = ℚ(t)</text>
<text x="1300" y="1072" text-anchor="middle" class="mono">t³+2t+1=0</text>
<text x="1300" y="1115" text-anchor="middle" class="body">degree 3 · non-Galois</text>

<!-- Q -->
<rect x="640" y="1280" width="220" height="90" rx="10" class="field"/>
<text x="750" y="1335" text-anchor="middle" class="mono">ℚ</text>

<line x1="700" y1="1280" x2="240" y2="1170" class="incl"/>
<text x="410" y="1235" class="degree">[K₁:ℚ]=2</text>
<line x1="735" y1="1280" x2="570" y2="1170" class="incl"/>
<text x="600" y="1225" class="degree">[K₂:ℚ]=4</text>
<line x1="765" y1="1280" x2="920" y2="1170" class="incl"/>
<text x="800" y="1225" class="degree">[K₃:ℚ]=2</text>
<line x1="800" y1="1280" x2="1250" y2="1170" class="incl"/>
<text x="1000" y="1235" class="degree">[K₄:ℚ]=3</text>

<!-- guides for K1, K3 entering later -->
<path d="M210 990 C210 770,430 480,690 400" class="guide"/>
<text x="90" y="638" class="small">K₁ enters at the</text>
<text x="90" y="665" class="small">degree-288 stage</text>
<path d="M930 990 C1030 800,1130 480,1030 400" class="guide"/>
<text x="1085" y="649" class="small">K₃ enters at the</text>
<text x="1085" y="676" class="small">degree-576 stage</text>

<text x="750" y="1390" text-anchor="middle" class="small">Solid arrows are field inclusions. Tan arrows emphasize the sequential compositum steps used in the degree-multiplication proof.</text>
</svg>
