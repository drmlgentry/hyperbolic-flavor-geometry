<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" role="img" aria-labelledby="title desc">
<title id="title">The Galois-Weyl Correspondence</title>
<desc id="desc">Three-tier diagram separating proved Galois-group computations, exact abstract Weyl-group isomorphisms, and HFG physical interpretation.</desc>

<rect width="1400" height="1100" fill="#f7f4ef"/>

<style>
  .title { font-family: "EB Garamond", Georgia, serif; font-size: 38px; font-weight: 600; fill: #1a1a1a; }
  .subtitle { font-family: "EB Garamond", Georgia, serif; font-size: 19px; font-style: italic; fill: #7b5a2e; }
  .tierhead { font-family: "EB Garamond", Georgia, serif; font-size: 22px; font-weight: 600; fill: #1a1a1a; }
  .body { font-family: "EB Garamond", Georgia, serif; font-size: 18px; fill: #1a1a1a; }
  .small { font-family: "EB Garamond", Georgia, serif; font-size: 15px; fill: #1a1a1a; }
  .mono { font-family: "JetBrains Mono", "Courier New", monospace; font-size: 17px; fill: #1a1a1a; }
  .monoGreen { font-family: "JetBrains Mono", "Courier New", monospace; font-size: 18px; font-weight: 700; fill: #2a5e2a; }
  .proved { font-family: "EB Garamond", Georgia, serif; font-size: 15px; font-weight: 700; fill: #2a5e2a; letter-spacing: .05em; }
  .interp { font-family: "EB Garamond", Georgia, serif; font-size: 16px; font-weight: 700; fill: #7b5a2e; letter-spacing: .03em; }
  .cardtitle { font-family: "JetBrains Mono", "Courier New", monospace; font-size: 22px; font-weight: 700; fill: #1a1a1a; }
  .arrow { stroke: #1a1a1a; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
  .greenarrow { stroke: #2a5e2a; stroke-width: 1.9; fill: none; marker-end: url(#greenarrow); }
  .greenbox { fill: #2a5e2a; fill-opacity: 0.10; stroke: #2a5e2a; stroke-width: 1.5; }
  .tanbox { fill: #7b5a2e; fill-opacity: 0.10; stroke: #7b5a2e; stroke-width: 1.4; }
  .plainbox { fill: none; stroke: #b8b2aa; stroke-width: 1.2; }
</style>

<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#1a1a1a"/>
  </marker>
  <marker id="greenarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#2a5e2a"/>
  </marker>
</defs>

<!-- Header -->
<text x="700" y="55" text-anchor="middle" class="title">FIGURE 5 — THE GALOIS-WEYL CORRESPONDENCE</text>
<text x="700" y="88" text-anchor="middle" class="subtitle">Arithmetic geometry of hyperbolic cusps → exact group theory → physical interpretation</text>

<!-- Tier 1 header -->
<text x="70" y="132" class="tierhead">TIER 1 — INDIVIDUAL GALOIS GROUPS</text>
<rect x="1110" y="106" width="160" height="34" rx="8" class="greenbox"/>
<text x="1190" y="129" text-anchor="middle" class="proved">PROVED</text>

<!-- Tier 1 cards -->
<rect x="60" y="160" width="390" height="180" rx="12" class="greenbox"/>
<text x="85" y="193" class="cardtitle">m003</text>
<text x="85" y="225" class="body">Cusp polynomial</text>
<text x="85" y="253" class="mono">x² − x + 1</text>
<text x="85" y="289" class="body">Galois group</text>
<text x="245" y="289" class="monoGreen">Gal ≅ ℤ/2</text>

<rect x="505" y="160" width="390" height="180" rx="12" class="greenbox"/>
<text x="530" y="193" class="cardtitle">m006</text>
<text x="530" y="225" class="body">Cusp polynomial</text>
<text x="530" y="253" class="mono">8x³ − 24x² + 28x − 11</text>
<text x="530" y="289" class="body">Galois group</text>
<text x="690" y="289" class="monoGreen">Gal ≅ S₃</text>

<rect x="950" y="160" width="390" height="180" rx="12" class="greenbox"/>
<text x="975" y="193" class="cardtitle">m019</text>
<text x="975" y="225" class="body">Cusp polynomial</text>
<text x="975" y="253" class="mono">x⁴ − x − 1</text>
<text x="975" y="289" class="body">Galois group</text>
<text x="1135" y="289" class="monoGreen">Gal ≅ S₄</text>

<!-- Tier 2 -->
<line x1="60" y1="380" x2="1340" y2="380" stroke="#d2cbc0" stroke-width="1.2"/>
<text x="70" y="422" class="tierhead">TIER 2 — FIELD TOWER AND ABSTRACT GROUP ISOMORPHISM</text>
<rect x="1110" y="396" width="160" height="34" rx="8" class="greenbox"/>
<text x="1190" y="419" text-anchor="middle" class="proved">PROVED</text>

<!-- Field tower chain -->
<rect x="60" y="470" width="275" height="120" rx="10" class="greenbox"/>
<text x="198" y="500" text-anchor="middle" class="body">Parent fields</text>
<text x="198" y="535" text-anchor="middle" class="mono">K(m003), K(m019)</text>
<text x="198" y="565" text-anchor="middle" class="small">arithmetically independent inputs</text>

<line x1="335" y1="530" x2="405" y2="530" class="greenarrow"/>

<rect x="405" y="470" width="290" height="120" rx="10" class="greenbox"/>
<text x="550" y="500" text-anchor="middle" class="body">Compositum</text>
<text x="550" y="535" text-anchor="middle" class="mono">K(m003)·K(m019)</text>
<text x="550" y="565" text-anchor="middle" class="monoGreen">degree 8</text>

<line x1="695" y1="530" x2="765" y2="530" class="greenarrow"/>

<rect x="765" y="470" width="260" height="120" rx="10" class="greenbox"/>
<text x="895" y="500" text-anchor="middle" class="body">Galois closure</text>
<text x="895" y="535" text-anchor="middle" class="mono">L</text>
<text x="895" y="565" text-anchor="middle" class="monoGreen">degree 48</text>

<line x1="1025" y1="530" x2="1095" y2="530" class="greenarrow"/>

<rect x="1095" y="470" width="245" height="120" rx="10" class="greenbox"/>
<text x="1217" y="500" text-anchor="middle" class="body">Galois group</text>
<text x="1217" y="535" text-anchor="middle" class="monoGreen">Gal(L/ℚ)</text>
<text x="1217" y="565" text-anchor="middle" class="monoGreen">≅ S₄ × ℤ/2</text>

<!-- Exact Weyl-group isomorphism -->
<rect x="320" y="630" width="760" height="110" rx="12" class="greenbox"/>
<text x="700" y="665" text-anchor="middle" class="body">Exact abstract group isomorphism</text>
<text x="700" y="708" text-anchor="middle" class="monoGreen">S₄ × ℤ/2  ≅  Weyl(SU(4)) × Weyl(SU(2))</text>

<text x="700" y="760" text-anchor="middle" class="small">The theorem / exact group theory ends above this line.</text>

<!-- Heavy divider -->
<line x1="60" y1="790" x2="1340" y2="790" stroke="#7b5a2e" stroke-width="4"/>

<!-- Tier 3 -->
<rect x="60" y="812" width="1280" height="238" rx="14" class="tanbox"/>
<text x="90" y="848" class="interp">HFG INTERPRETATION — PHYSICS (not part of the proved theorem)</text>

<!-- three interpretation cards -->
<rect x="90" y="875" width="360" height="95" rx="10" fill="#7b5a2e" fill-opacity="0.06" stroke="#7b5a2e" stroke-width="1.1"/>
<text x="270" y="910" text-anchor="middle" class="mono">Weyl(SU(2))</text>
<text x="270" y="944" text-anchor="middle" class="body">→ weak force</text>

<rect x="520" y="875" width="360" height="95" rx="10" fill="#7b5a2e" fill-opacity="0.06" stroke="#7b5a2e" stroke-width="1.1"/>
<text x="700" y="910" text-anchor="middle" class="mono">Weyl(SU(3))</text>
<text x="700" y="944" text-anchor="middle" class="body">→ strong force</text>

<rect x="950" y="875" width="360" height="95" rx="10" fill="#7b5a2e" fill-opacity="0.06" stroke="#7b5a2e" stroke-width="1.1"/>
<text x="1130" y="910" text-anchor="middle" class="mono">Weyl(SU(4))</text>
<text x="1130" y="944" text-anchor="middle" class="body">→ Pati-Salam sector</text>

<text x="700" y="1002" text-anchor="middle" class="small">
  Assigning physical gauge-force meaning to these Weyl groups is HFG's interpretation.
</text>
<text x="700" y="1027" text-anchor="middle" class="small">
  No field-theoretic mechanism currently connects the exact group isomorphism above to an actual gauge theory; this question is open.
</text>

</svg>