<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
<title id="title">The Weyl-Product Correspondence</title>
<desc id="desc">Each Galois factor of the 576-element closure is abstractly isomorphic to the Weyl group of a Standard Model gauge factor: C2 to W(SU(2)), S4 to W(SU(4)), C2 to W(SU(2)), S3 to W(SU(3)). The combined isomorphism reads as the Weyl group of SU(4) x SU(2)_L x SU(2)_R x SU(3)_C, the Pati-Salam-plus-color structure. Assigning physical labels to the abstract factors is interpretation, not part of the theorem.</desc>
<rect width="1600" height="1040" fill="#f7f4ef"/>
<style>
 .t{font-family:"EB Garamond",Georgia,serif;fill:#1a1a1a}
 .m{font-family:"JetBrains Mono","Courier New",monospace;fill:#1a1a1a}
 .title{font-size:40px;font-weight:600}
 .sub{font-size:19px;font-style:italic;fill:#7b5a2e}
 .head{font-size:23px;font-weight:600}
 .body{font-size:17px}
 .small{font-size:14px}
 .mono{font-size:17px}
 .green{fill:#2a5e2a;font-weight:700}
 .tan{fill:#7b5a2e}
 .algebra{fill:#2a5e2a;fill-opacity:.08;stroke:#2a5e2a;stroke-width:1.4}
 .physical{fill:#7b5a2e;fill-opacity:.08;stroke:#7b5a2e;stroke-width:1.4}
 .interp{fill:#7b5a2e;fill-opacity:.08;stroke:#7b5a2e;stroke-width:1.4}
 .link{stroke:#2a5e2a;stroke-width:2;stroke-dasharray:2 4}
</style>

<text x="800" y="56" text-anchor="middle" class="t title">The Weyl-Product Correspondence</text>
<text x="800" y="88" text-anchor="middle" class="t sub">Four abstract Galois factors, four Weyl groups — an exact isomorphism, factor by factor</text>

<text x="70" y="138" class="t head">PROVED: FACTOR-BY-FACTOR ISOMORPHISM</text>

<!-- Column headers -->
<text x="330" y="172" text-anchor="middle" class="t small tan" letter-spacing="0.08em">GALOIS FACTOR</text>
<text x="1270" y="172" text-anchor="middle" class="t small tan" letter-spacing="0.08em">WEYL GROUP</text>

<!-- Row 1: C2 <-> W(SU(2))_L -->
<rect x="90" y="188" width="480" height="82" rx="12" class="algebra"/>
<text x="115" y="220" class="m mono">Gal(K₁/ℚ) ≅ C₂</text>
<text x="115" y="246" class="t small">K₁ = ℚ(√−3), ramified at {3}</text>
<line x1="570" y1="229" x2="1050" y2="229" class="link"/>
<text x="810" y="220" text-anchor="middle" class="t body green">≅</text>
<rect x="1050" y="188" width="460" height="82" rx="12" class="physical"/>
<text x="1075" y="220" class="m mono tan">W(SU(2)) ≅ C₂</text>
<text x="1075" y="246" class="t small">reflection group of SU(2)_L</text>

<!-- Row 2: S4 <-> W(SU(4)) -->
<rect x="90" y="290" width="480" height="82" rx="12" class="algebra"/>
<text x="115" y="322" class="m mono">Gal(L₂/ℚ) ≅ S₄</text>
<text x="115" y="348" class="t small">L₂ = closure(K₂), ramified at {283}</text>
<line x1="570" y1="331" x2="1050" y2="331" class="link"/>
<text x="810" y="322" text-anchor="middle" class="t body green">≅</text>
<rect x="1050" y="290" width="460" height="82" rx="12" class="physical"/>
<text x="1075" y="322" class="m mono tan">W(SU(4)) ≅ S₄</text>
<text x="1075" y="348" class="t small">reflection group of Pati-Salam SU(4)</text>

<!-- Row 3: C2 <-> W(SU(2))_R -->
<rect x="90" y="392" width="480" height="82" rx="12" class="algebra"/>
<text x="115" y="424" class="m mono">Gal(K₃/ℚ) ≅ C₂</text>
<text x="115" y="450" class="t small">K₃ = ℚ(√−7), ramified at {7}</text>
<line x1="570" y1="433" x2="1050" y2="433" class="link"/>
<text x="810" y="424" text-anchor="middle" class="t body green">≅</text>
<rect x="1050" y="392" width="460" height="82" rx="12" class="physical"/>
<text x="1075" y="424" class="m mono tan">W(SU(2)) ≅ C₂</text>
<text x="1075" y="450" class="t small">reflection group of SU(2)_R</text>

<!-- Row 4: S3 <-> W(SU(3)) -->
<rect x="90" y="494" width="480" height="82" rx="12" class="algebra"/>
<text x="115" y="526" class="m mono">Gal(L₄/ℚ) ≅ S₃</text>
<text x="115" y="552" class="t small">L₄ = closure(K₄), ramified at {59}</text>
<line x1="570" y1="535" x2="1050" y2="535" class="link"/>
<text x="810" y="526" text-anchor="middle" class="t body green">≅</text>
<rect x="1050" y="494" width="460" height="82" rx="12" class="physical"/>
<text x="1075" y="526" class="m mono tan">W(SU(3)) ≅ S₃</text>
<text x="1075" y="552" class="t small">reflection group of color SU(3)_C</text>

<!-- Combined isomorphism -->
<text x="70" y="628" class="t head">THE COMBINED ISOMORPHISM</text>
<rect x="90" y="650" width="1420" height="130" rx="16" class="algebra"/>
<text x="800" y="690" text-anchor="middle" class="m mono green" font-size="21">Gal(L/ℚ) ≅ C₂ × S₄ × C₂ × S₃</text>
<text x="800" y="722" text-anchor="middle" class="m mono green" font-size="21">≅ W(SU(2)) × W(SU(4)) × W(SU(2)) × W(SU(3))</text>
<text x="800" y="752" text-anchor="middle" class="t small">order 576 = 2 × 24 × 2 × 6, factor by factor, no relabeling required</text>

<!-- theorem boundary -->
<line x1="70" y1="825" x2="1530" y2="825" stroke="#7b5a2e" stroke-width="4"/>
<text x="800" y="853" text-anchor="middle" class="t small tan">THE PROVED ALGEBRA ENDS ABOVE THIS LINE</text>

<!-- interpretation -->
<rect x="90" y="875" width="1420" height="140" rx="14" class="interp"/>
<text x="800" y="908" text-anchor="middle" class="t head tan">HFG INTERPRETATION — PHYSICS</text>
<text x="800" y="942" text-anchor="middle" class="m mono" font-size="18">Rearranged: W(SU(4) × SU(2)_L × SU(2)_R × SU(3)_C) — the Pati-Salam-plus-color Weyl group</text>
<text x="800" y="975" text-anchor="middle" class="t small">Which manifold gets which physical label is an interpretive choice; the group isomorphism itself is exact and does not depend on it.</text>
</svg>
