<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0a1628"/><text x="800" y="65" font-family="Arial,Helvetica,sans-serif" font-size="36" fill="#f8fafc" text-anchor="middle" font-weight="600">WHAT SURVIVED VERIFICATION — AND WHAT DID NOT</text><rect x="80" y="130" width="700" height="650" rx="24" fill="#10233f" stroke="#34d399" stroke-width="4"/><rect x="820" y="130" width="700" height="650" rx="24" fill="#10233f" stroke="#fb7185" stroke-width="4"/><text x="430" y="190" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#34d399" text-anchor="middle" font-weight="600">SURVIVED</text><text x="1170" y="190" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#fb7185" text-anchor="middle" font-weight="600">DID NOT SURVIVE</text><text x="140" y="275" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#34d399" text-anchor="start" font-weight="600">✓</text><text x="195" y="275" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#f8fafc" text-anchor="start" font-weight="400">Dual filling isometry</text><text x="140" y="380" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#34d399" text-anchor="start" font-weight="600">✓</text><text x="195" y="380" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#f8fafc" text-anchor="start" font-weight="400">m019 cusp-field Galois group S₄</text><text x="140" y="485" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#34d399" text-anchor="start" font-weight="600">✓</text><text x="195" y="485" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#f8fafc" text-anchor="start" font-weight="400">Compositum/Galois-closure programme</text><text x="140" y="590" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#34d399" text-anchor="start" font-weight="600">✓</text><text x="195" y="590" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#f8fafc" text-anchor="start" font-weight="400">Exact Weyl-group identifications</text><text x="880" y="275" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#fb7185" text-anchor="start" font-weight="600">×</text><text x="935" y="275" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#f8fafc" text-anchor="start" font-weight="400">Eisenstein-norm mass significance</text><text x="880" y="380" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#fb7185" text-anchor="start" font-weight="600">×</text><text x="935" y="380" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#f8fafc" text-anchor="start" font-weight="400">“Parameter-free” tau inference</text><text x="880" y="485" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#fb7185" text-anchor="start" font-weight="600">×</text><text x="935" y="485" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#f8fafc" text-anchor="start" font-weight="400">BPS-spectrum derivation as currently stated</text><text x="880" y="590" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#fb7185" text-anchor="start" font-weight="600">×</text><text x="935" y="590" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#f8fafc" text-anchor="start" font-weight="400">Claim of a full Pati–Salam mechanism</text><text x="800" y="840" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle" font-weight="600">Separating structure from interpretation makes the programme stronger.</text></svg>