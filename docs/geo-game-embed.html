<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geodesic Challenge — HFG</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#07070f;color:#ece8df;font-family:'JetBrains Mono',monospace;overflow:hidden;}
.bar{display:flex;align-items:center;justify-content:space-between;padding:.65rem 1.1rem;background:#0d0d1a;border-bottom:1px solid rgba(201,168,76,.2);}
.score{font-size:.82rem;color:#c9a84c;}
.btns{display:flex;gap:.4rem;}
.btn{font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;padding:.38rem .9rem;border:1px solid;cursor:pointer;background:transparent;transition:all .2s;}
.btn-g{border-color:#c9a84c;color:#c9a84c;} .btn-g:hover{background:#c9a84c;color:#07070f;}
.btn-r{border-color:#e84393;color:#e84393;} .btn-r:hover{background:#e84393;color:#fff;}
canvas{display:block;width:100%;cursor:none;}
@keyframes popUp{0%{opacity:1;transform:translate(-50%,-50%);}100%{opacity:0;transform:translate(-50%,-120%);}}
.pips{display:flex;align-items:center;gap:.4rem;padding:.4rem 1.1rem;background:#07070f;border-top:1px solid rgba(255,255,255,.05);flex-wrap:wrap;}
.pip-lbl{font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;color:#7a7570;margin-right:.2rem;}
.pip{width:12px;height:12px;border-radius:50%;border:2px solid #333;transition:all .3s;}
.legend{margin-left:auto;display:flex;gap:.8rem;align-items:center;}
.leg-item{display:flex;align-items:center;gap:.3rem;font-size:.55rem;color:#7a7570;}
.leg-dot{width:8px;height:8px;border-radius:50%;}
.cap{padding:.55rem 1.1rem;font-size:.62rem;color:#7a7570;line-height:1.6;min-height:2.6rem;background:#0d0d1a;border-top:1px solid rgba(201,168,76,.1);}
</style>
</head>
<body>
<div class="bar">
  <span class="score">Score: <span id="sc">0</span> / <span id="tot">0</span> &nbsp;·&nbsp; Round <span id="rnd">1</span>/20</span>
  <div class="btns">
    <button class="btn btn-g" id="btnNext">Next Round</button>
    <button class="btn btn-r" id="btnRestart">Restart</button>
  </div>
</div>

<canvas id="cv" height="420"></canvas>

<div id="scoreboard" style="display:none;position:fixed;inset:0;background:rgba(7,7,15,.95);z-index:200;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;font-family:'JetBrains Mono',monospace;">
  <div style="font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:#c9a84c;">Game Complete</div>
  <div id="sb-score" style="font-family:'Playfair Display',serif;font-size:4rem;color:#ffd700;line-height:1;"></div>
  <div id="sb-grade" style="font-size:1.1rem;font-weight:500;letter-spacing:.05em;"></div>
  <div id="sb-sub" style="font-size:.7rem;color:#7a7570;max-width:300px;text-align:center;line-height:1.6;"></div>
  <div style="display:flex;gap:.6rem;margin-top:.5rem;">
    <button class="btn btn-r" id="sbRestart">Play Again</button>
  </div>
</div>
<div class="pips">
  <span class="pip-lbl">Stage</span>
  <div class="pip" id="p0"></div>
  <div class="pip" id="p1"></div>
  <div class="pip" id="p2"></div>
  <div class="pip" id="p3"></div>
  <div class="pip" id="p4"></div>
  <span id="sname" style="font-size:.6rem;margin-left:.5rem;"></span>
  <!-- Legend -->
  <div class="legend">
    <div class="leg-item"><div class="leg-dot" style="background:#c9a84c;"></div>Stage 1</div>
    <div class="leg-item"><div class="leg-dot" style="background:#4ecdc4;"></div>Stage 2</div>
    <div class="leg-item"><div class="leg-dot" style="background:#50fa7b;"></div>Stage 3</div>
    <div class="leg-item"><div class="leg-dot" style="background:#ff9500;"></div>Stage 4</div>
    <div class="leg-item"><div class="leg-dot" style="background:#e84393;"></div>Stage 5</div>
  </div>
</div>

<div id="popup" style="position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);font-family:JetBrains Mono,monospace;font-size:2.8rem;font-weight:500;pointer-events:none;opacity:0;z-index:99;transition:none;"></div>
<div class="cap" id="cap">Click where you think the geodesic — the hyperbolic straight line — passes between the two gold points.</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

const STAGES = [
  { name:'Stage 1',  color:'#c9a84c', px:18, hitPx:68, unlockAt:0 },
  { name:'Stage 2',  color:'#4ecdc4', px:14, hitPx:42, unlockAt:1 },
  { name:'Stage 3',  color:'#50fa7b', px:10, hitPx:28, unlockAt:2 },
  { name:'Stage 4',  color:'#ff9500', px:7,  hitPx:18, unlockAt:3 },
  { name:'Stage 5',  color:'#e84393', px:5,  hitPx:11, unlockAt:4 },
];

let W, H, t = 0;
let p1, p2, guess, phase;
let score = 0, rounds = 0, correctHits = 0;
let mx = 200, my = 200;

function stage() {
  for (let i = STAGES.length-1; i >= 0; i--)
    if (correctHits >= STAGES[i].unlockAt) return i;
  return 0;
}

function updatePips() {
  const s = stage();
  STAGES.forEach((st, i) => {
    const pip = document.getElementById('p'+i);
    if (i < s) {
      pip.style.background = st.color;
      pip.style.borderColor = st.color;
      pip.style.boxShadow = `0 0 6px ${st.color}`;
    } else if (i === s) {
      pip.style.background = 'transparent';
      pip.style.borderColor = st.color;
      pip.style.boxShadow = `0 0 8px ${st.color}`;
    } else {
      pip.style.background = 'transparent';
      pip.style.borderColor = '#333';
      pip.style.boxShadow = 'none';
    }
  });
  const st = STAGES[s];
  document.getElementById('sname').textContent = st.name;
  document.getElementById('sname').style.color = st.color;
}

// Audio
let ac;
function beep(freq,dur,type='sine',vol=0.15){
  if(!ac)return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
  o.start();o.stop(ac.currentTime+dur);
}
function sndHit() { beep(523,.1,'sine',.2);setTimeout(()=>beep(784,.18,'sine',.1),140); }
function sndMiss(){ beep(200,.18,'sawtooth',.12); }
function sndUp()  { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.09,'square',.1),i*90)); }
function sndNew() { beep(440,.05,'square',.07); }

function resize(){ W=cv.width=cv.offsetWidth; H=parseInt(cv.getAttribute('height')); }

function arcCtrl(p1,p2){
  const cx=W/2,cy=H/2,R=Math.min(W,H)*0.44;
  const ax=cx+p1[0]*R,ay=cy+p1[1]*R;
  const bx=cx+p2[0]*R,by=cy+p2[1]*R;
  const mx=(ax+bx)/2,my=(ay+by)/2;
  const dx=mx-cx,dy=my-cy;
  return{cpx:mx-dx*0.4,cpy:my-dy*0.4,ax,ay,bx,by};
}

function newRound(){
  if(rounds>=20){gameOver();return;}
  if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
  sndNew();
  phase='aim';guess=null;
  const a1=Math.random()*Math.PI*2,r1=.3+Math.random()*.45;
  const a2=a1+1.1+Math.random()*1.7,r2=.3+Math.random()*.45;
  p1=[r1*Math.cos(a1),r1*Math.sin(a1)];
  p2=[r2*Math.cos(a2),r2*Math.sin(a2)];
  document.getElementById('rnd').textContent=Math.min(rounds+1,20);
  document.getElementById('cap').textContent=
    `${STAGES[stage()].name} · Click where the geodesic passes through.`;
  updatePips();
}

function gameOver(){
  const grades=[
    [18,'S — Hyperbolic Master','Genuine non-Euclidean spatial intuition.'],
    [15,'A — Exceptional','Your instincts have recalibrated to negative curvature.'],
    [12,'B — Strong','You can feel the geodesics now.'],
    [8, 'C — Getting There','The geometry is starting to make sense.'],
    [5, 'D — Euclidean Habits','Try again — the shift usually happens mid-game.'],
    [0, 'F — Pure Euclid','Nobody gets it right away. Try again.'],
  ];
  const[,grade,sub]=grades.find(([min])=>score>=min);
  // Game over sound — descending fanfare
  if(ac){
    [784,659,523,440,349].forEach((f,i)=>setTimeout(()=>beep(f,.15,'sine',.18),i*120));
  }
  // Show scoreboard overlay
  document.getElementById('scoreboard').style.display='flex';
  document.getElementById('sb-score').textContent=score+'/20';
  document.getElementById('sb-grade').textContent=grade;
  document.getElementById('sb-sub').textContent=sub;
  document.getElementById('sb-grade').style.color=
    score>=18?'#ffd700':score>=15?'#4ecdc4':score>=12?'#50fa7b':
    score>=8?'#ff9500':score>=5?'#c9a84c':'#e84393';
  document.getElementById('cap').textContent=`${grade} · Click Restart to play again.`;
}

function restart(){
  score=0;rounds=0;correctHits=0;
  document.getElementById('sc').textContent='0';
  document.getElementById('tot').textContent='0';
  document.getElementById('rnd').textContent='1';
  document.getElementById('scoreboard').style.display='none';
  updatePips();newRound();
}

function showPopup(txt,col){
  const el=document.getElementById('popup');
  el.textContent=txt;
  el.style.color=col;
  el.style.animation='none';
  void el.offsetWidth;
  el.style.animation='popUp .75s ease-out forwards';
}

// Click — GPT's fix: measure distance to actual curve, not just control point
cv.addEventListener('click',e=>{
  if(phase!=='aim')return;
  if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();

  const rect=cv.getBoundingClientRect();
  const cx=W/2,cy=H/2,R=Math.min(W,H)*0.44;
  const clickX=(e.clientX-rect.left)*(W/rect.width);
  const clickY=(e.clientY-rect.top)*(H/rect.height);

  const{cpx,cpy,ax,ay,bx,by}=arcCtrl(p1,p2);

  // Sample 100 points along the actual geodesic curve
  let minDist=Infinity;
  for(let i=0;i<=100;i++){
    const tt=i/100;
    const x=(1-tt)*(1-tt)*ax+2*(1-tt)*tt*cpx+tt*tt*bx;
    const y=(1-tt)*(1-tt)*ay+2*(1-tt)*tt*cpy+tt*tt*by;
    const d=Math.hypot(clickX-x,clickY-y);
    if(d<minDist)minDist=d;
  }

  const hitRadius=STAGES[stage()].hitPx*1.35; // extra generous
  const hit=minDist<hitRadius;

  guess=[(clickX-cx)/R,(clickY-cy)/R];
  phase='reveal';
  rounds++;

  const prevStage=stage();
  if(hit){
    score++;correctHits++;
    sndHit();
    if(stage()>prevStage)sndUp();
    showPopup('+1','#ffd700');
  } else {
    sndMiss();
    showPopup('—','#e84393');
  }

  document.getElementById('sc').textContent=score;
  document.getElementById('tot').textContent=rounds;
  updatePips();

  if(rounds>=20){
    setTimeout(gameOver, 400);
    return;
  }

  const ns=stage();
  document.getElementById('cap').textContent=hit
    ?`✓ Hit! Score ${score}/${rounds}${ns>prevStage?' · Stage up — reticle changes color!':''} · Click Next Round`
    :`Miss — geodesic curves more toward center than Euclidean instinct expects. ${score}/${rounds} · Click Next Round`;
});

cv.addEventListener('mousemove',e=>{
  const rect=cv.getBoundingClientRect();
  mx=(e.clientX-rect.left)*(W/rect.width);
  my=(e.clientY-rect.top)*(H/rect.height);
});

document.getElementById('btnNext').addEventListener('click',()=>{ if(phase==='reveal')newRound(); });
document.getElementById('btnRestart').addEventListener('click',restart);
document.getElementById('sbRestart').addEventListener('click',restart);

function draw(){
  ctx.clearRect(0,0,W,H);
  const cx=W/2,cy=H/2,R=Math.min(W,H)*0.44;
  const s=stage(),st=STAGES[s];

  // Background
  const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,R);
  bg.addColorStop(0,'rgba(12,12,28,1)');bg.addColorStop(1,'rgba(4,4,10,1)');
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle=bg;ctx.fill();

  // Grid
  for(let i=0;i<10;i++){
    const a=i*Math.PI/5+t*.0008;
    ctx.beginPath();
    ctx.moveTo(cx+R*.98*Math.cos(a),cy+R*.98*Math.sin(a));
    ctx.lineTo(cx-R*.98*Math.cos(a),cy-R*.98*Math.sin(a));
    ctx.strokeStyle='rgba(201,168,76,.05)';ctx.lineWidth=.5;ctx.stroke();
  }

  // Boundary
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.strokeStyle='rgba(201,168,76,.35)';ctx.lineWidth=1.5;ctx.stroke();

  if(p1&&p2){
    const{cpx,cpy,ax,ay,bx,by}=arcCtrl(p1,p2);

    // Faint euclidean hint
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);
    ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;
    ctx.setLineDash([3,5]);ctx.stroke();ctx.setLineDash([]);

    // Gold points
    [[ax,ay],[bx,by]].forEach(([x,y])=>{
      ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);
      ctx.fillStyle='#c9a84c';ctx.fill();
      ctx.strokeStyle='#ffd700';ctx.lineWidth=2;ctx.stroke();
    });

    if(phase==='reveal'){
      ctx.beginPath();ctx.moveTo(ax,ay);
      ctx.quadraticCurveTo(cpx,cpy,bx,by);
      ctx.strokeStyle=st.color;ctx.lineWidth=2.5;ctx.stroke();
      ctx.fillStyle=st.color;ctx.font='11px JetBrains Mono';
      ctx.fillText('geodesic',cpx+8,cpy-8);
      if(guess){
        const gx=cx+guess[0]*R,gy=cy+guess[1]*R;
        ctx.beginPath();ctx.arc(gx,gy,6,0,Math.PI*2);
        ctx.fillStyle='#e84393';ctx.fill();
        ctx.fillStyle='#e84393';ctx.font='10px JetBrains Mono';
        ctx.fillText('your guess',gx+9,gy-5);
      }
    }
  }

  // HUD
  ctx.fillStyle=st.color;ctx.font='10px JetBrains Mono';
  ctx.fillText(`${st.name}  ·  ${correctHits} correct hits`,10,H-10);

  // Reticle — always visible, color = current stage
  const sz=st.px,col=st.color;
  ctx.strokeStyle=col;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(mx,my,sz,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(mx,my,sz*.32,0,Math.PI*2);ctx.stroke();
  const gap=sz*.18;
  ctx.beginPath();
  ctx.moveTo(mx-sz*1.4,my);ctx.lineTo(mx-gap,my);
  ctx.moveTo(mx+gap,my);   ctx.lineTo(mx+sz*1.4,my);
  ctx.moveTo(mx,my-sz*1.4);ctx.lineTo(mx,my-gap);
  ctx.moveTo(mx,my+gap);   ctx.lineTo(mx,my+sz*1.4);
  ctx.stroke();
  for(let i=0;i<4;i++){
    const a=i*Math.PI/2+Math.PI/4;
    ctx.beginPath();
    ctx.moveTo(mx+sz*.72*Math.cos(a),my+sz*.72*Math.sin(a));
    ctx.lineTo(mx+sz*.96*Math.cos(a),my+sz*.96*Math.sin(a));
    ctx.stroke();
  }
  const pulse=.88+.12*Math.sin(t*.12);
  const r=parseInt(col.slice(1,3),16),g2=parseInt(col.slice(3,5),16),b=parseInt(col.slice(5,7),16);
  ctx.beginPath();ctx.arc(mx,my,sz*1.6*pulse,0,Math.PI*2);
  ctx.strokeStyle=`rgba(${r},${g2},${b},.12)`;ctx.lineWidth=.8;ctx.stroke();

  t++;requestAnimationFrame(draw);
}

resize();
window.addEventListener('resize',resize);
updatePips();newRound();draw();
</script>
</body>
</html>
