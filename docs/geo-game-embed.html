<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geodesic Challenge — HFG</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#07070f;color:#ece8df;font-family:'JetBrains Mono',monospace;overflow:hidden;}
.bar{display:flex;align-items:center;justify-content:space-between;padding:.65rem 1.1rem;background:#0d0d1a;border-bottom:1px solid rgba(201,168,76,.18);flex-wrap:wrap;gap:.4rem;}
.title{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:#c9a84c;}
.score{font-size:.82rem;color:#c9a84c;}
.btn{font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;padding:.38rem .9rem;border:1px solid;cursor:pointer;transition:all .2s;background:transparent;}
.btn-g{border-color:#c9a84c;color:#c9a84c;}
.btn-g:hover{background:#c9a84c;color:#07070f;}
.btn-r{border-color:#e84393;color:#e84393;}
.btn-r:hover{background:#e84393;color:#fff;}
canvas{display:block;width:100%;cursor:none;}
.cap{padding:.55rem 1.1rem;font-size:.62rem;color:#7a7570;line-height:1.65;min-height:2.8rem;background:#0d0d1a;border-top:1px solid rgba(201,168,76,.1);}
</style>
</head>
<body>
<div class="bar">
  <span class="title">Geodesic Challenge</span>
  <span class="score">Score: <span id="gScore">0</span>/<span id="gTotal">0</span> &nbsp;|&nbsp; Level <span id="gLevel">1</span></span>
  <div style="display:flex;gap:.4rem;">
    <button class="btn btn-g" id="gNew">Next Round</button>
    <button class="btn btn-r" id="gRestart">Restart</button>
  </div>
</div>
<canvas id="geoGame" height="430"></canvas>
<div class="cap" id="gCap">Two gold points have been placed. Click where you think the geodesic — the hyperbolic straight line — passes between them.</div>

<script>
(()=>{
  const c=document.getElementById('geoGame'),ctx=c.getContext('2d');
  let W,H,t=0,gP1=null,gP2=null,guess=null,state='guess';
  let score=0,total=0,level=1,reticleSize=28;
  let mouseX=200,mouseY=200;

  let audioCtx=null;
  function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
  function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.type=type||'sine';o.frequency.value=freq;
    g.gain.setValueAtTime(vol||.15,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
    o.start();o.stop(audioCtx.currentTime+dur);
  }
  function playHit(){
    playTone(523,.12,'sine',.2);
    setTimeout(()=>playTone(659,.15,'sine',.15),80);
    setTimeout(()=>playTone(784,.2,'sine',.1),180);
  }
  function playMiss(){
    playTone(220,.15,'sawtooth',.12);
    setTimeout(()=>playTone(180,.2,'sawtooth',.08),100);
  }
  function playNew(){
    playTone(440,.06,'square',.08);
    setTimeout(()=>playTone(550,.08,'square',.06),80);
  }

  function resize(){W=c.width=c.offsetWidth;H=parseInt(c.getAttribute('height'));}

  function getThreshold(){
    // reticleSize is in screen pixels. R = Math.min(W,H)*.44 pixels.
    // Convert to normalized coords and apply hidden generosity factor.
    const R = Math.min(W,H)*.44;
    const generosity = 1.35; // secretly over-generous
    return (reticleSize / R) * generosity;
  }

  function newRound(){
    initAudio();playNew();
    state='guess';guess=null;
    // reticleSize only shrinks on correct hit (see click handler)
    const a1=Math.random()*Math.PI*2,r1=.28+Math.random()*.48;
    const a2=a1+1.0+Math.random()*1.8,r2=.28+Math.random()*.48;
    gP1=[r1*Math.cos(a1),r1*Math.sin(a1)];
    gP2=[r2*Math.cos(a2),r2*Math.sin(a2)];
    level=Math.floor(total/3)+1;
    document.getElementById('gLevel').textContent=level;
    document.getElementById('gCap').textContent=
      `Level ${level} · Target size: ${Math.round(reticleSize)}px · Click where the geodesic passes through.`;
  }

  function showGameOver(){
    const grades=[
      [18,'S — Hyperbolic Master','You have genuine non-Euclidean spatial intuition.'],
      [15,'A — Exceptional','Your instincts have recalibrated to negative curvature.'],
      [12,'B — Strong','You can feel the geodesics. Euclid is losing his grip.'],
      [8, 'C — Getting There','The geometry is starting to make sense.'],
      [5, 'D — Euclidean Habits','Flat-space instincts are hard to shake. Try again.'],
      [0, 'F — Pure Euclid','Nobody gets it right away. The geometry is alien. Try again.'],
    ];
    const [,grade,sub]=grades.find(([min])=>score>=min);
    document.getElementById('gCap').textContent=
      `Game complete · ${score}/20 · ${grade} · ${sub} · Click Restart to play again.`;
  }

  function restart(){
    score=0;total=0;level=1;reticleSize=28;
    document.getElementById('gScore').textContent='0';
    document.getElementById('gTotal').textContent='0';
    document.getElementById('gLevel').textContent='1';
    newRound();
  }

  document.getElementById('gNew').addEventListener('click',()=>{
    if(state==='reveal'){
      if(total>=20){showGameOver();return;}
      newRound();
    }
  });
  document.getElementById('gRestart').addEventListener('click',restart);

  c.addEventListener('mousemove',e=>{
    const r=c.getBoundingClientRect();
    mouseX=(e.clientX-r.left)*(W/r.width);
    mouseY=(e.clientY-r.top)*(H/r.height);
  });

  function drawArc(p1,p2,color,width,cx,cy,R){
    const ax=cx+p1[0]*R,ay=cy+p1[1]*R;
    const bx=cx+p2[0]*R,by=cy+p2[1]*R;
    const mx=(ax+bx)/2,my=(ay+by)/2;
    const dx=mx-cx,dy=my-cy;
    const cpx=mx-dx*.4,cpy=my-dy*.4;
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.quadraticCurveTo(cpx,cpy,bx,by);
    ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();
    return{cpx,cpy};
  }

  function drawReticle(x,y,size,color){
    ctx.strokeStyle=color;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,size*.35,0,Math.PI*2);ctx.stroke();
    const gap=size*.18;
    ctx.beginPath();
    ctx.moveTo(x-size*1.35,y);ctx.lineTo(x-gap,y);
    ctx.moveTo(x+gap,y);ctx.lineTo(x+size*1.35,y);
    ctx.moveTo(x,y-size*1.35);ctx.lineTo(x,y-gap);
    ctx.moveTo(x,y+gap);ctx.lineTo(x,y+size*1.35);
    ctx.stroke();
    for(let i=0;i<4;i++){
      const a=i*Math.PI/2+Math.PI/4;
      ctx.beginPath();
      ctx.moveTo(x+size*.72*Math.cos(a),y+size*.72*Math.sin(a));
      ctx.lineTo(x+size*.96*Math.cos(a),y+size*.96*Math.sin(a));
      ctx.stroke();
    }
    const pulse=.88+.12*Math.sin(t*.12);
    ctx.beginPath();ctx.arc(x,y,size*1.55*pulse,0,Math.PI*2);
    ctx.strokeStyle='rgba(78,205,196,.12)';ctx.lineWidth=.8;ctx.stroke();
  }

  c.addEventListener('click',e=>{
    if(state!=='guess')return;
    initAudio();
    const rect=c.getBoundingClientRect(),cx=W/2,cy=H/2,R=Math.min(W,H)*.44;
    const mx=((e.clientX-rect.left)*(W/rect.width)-cx)/R;
    const my=((e.clientY-rect.top)*(H/rect.height)-cy)/R;
    if(mx*mx+my*my>=.93)return;
    guess=[mx,my];state='reveal';total++;
    const{cpx,cpy}=drawArc(gP1,gP2,'',0,cx,cy,R);
    const gMidX=(cpx-cx)/R,gMidY=(cpy-cy)/R;
    const dist=Math.sqrt((mx-gMidX)**2+(my-gMidY)**2);
    const threshold=getThreshold();
    const hit=dist<threshold;
    if(hit){
      score++;
      reticleSize=Math.max(8,reticleSize-3); // shrink only on correct guess
      playHit();
    }else{playMiss();}
    document.getElementById('gScore').textContent=score;
    document.getElementById('gTotal').textContent=total;
    document.getElementById('gCap').textContent=hit?
      `✓ Hit! Score: ${score}/${total} · Target shrinks next round → Click "Next Round"`:
      `Miss — geodesic curves toward center more than Euclidean instinct expects. Score: ${score}/${total}`;
  });

  function draw(){
    ctx.clearRect(0,0,W,H);
    const cx=W/2,cy=H/2,R=Math.min(W,H)*.44;
    const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,R);
    bg.addColorStop(0,'rgba(10,10,24,1)');bg.addColorStop(1,'rgba(4,4,10,1)');
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle=bg;ctx.fill();
    for(let i=0;i<10;i++){
      const a=i*Math.PI/5+t*.0008;
      ctx.beginPath();ctx.moveTo(cx+R*.98*Math.cos(a),cy+R*.98*Math.sin(a));
      ctx.lineTo(cx-R*.98*Math.cos(a),cy-R*.98*Math.sin(a));
      ctx.strokeStyle='rgba(201,168,76,.055)';ctx.lineWidth=.5;ctx.stroke();
    }
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.strokeStyle='rgba(201,168,76,.4)';ctx.lineWidth=1.5;ctx.stroke();

    if(gP1&&gP2){
      ctx.beginPath();ctx.moveTo(cx+gP1[0]*R,cy+gP1[1]*R);ctx.lineTo(cx+gP2[0]*R,cy+gP2[1]*R);
      ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;ctx.setLineDash([3,5]);ctx.stroke();ctx.setLineDash([]);
      [gP1,gP2].forEach(p=>{
        ctx.beginPath();ctx.arc(cx+p[0]*R,cy+p[1]*R,9,0,Math.PI*2);
        ctx.fillStyle='#c9a84c';ctx.fill();
        ctx.strokeStyle='#ffd700';ctx.lineWidth=2;ctx.stroke();
      });
      if(state==='reveal'){
        drawArc(gP1,gP2,'rgba(78,205,196,.95)',2.5,cx,cy,R);
        ctx.fillStyle='rgba(78,205,196,.7)';ctx.font='11px JetBrains Mono';
        ctx.fillText('geodesic',cx+10,cy-18);
        if(guess){
          ctx.beginPath();ctx.arc(cx+guess[0]*R,cy+guess[1]*R,7,0,Math.PI*2);
          ctx.fillStyle='#e84393';ctx.fill();
          ctx.fillStyle='#e84393';ctx.font='11px JetBrains Mono';
          ctx.fillText('your guess',cx+guess[0]*R+10,cy+guess[1]*R-6);
        }
      }
    }
    ctx.fillStyle='rgba(201,168,76,.35)';ctx.font='10px JetBrains Mono';
    ctx.fillText(`LVL ${level}  ·  TARGET Ø${Math.max(8,Math.round(reticleSize))}`,12,H-12);
    if(state==='guess')drawReticle(mouseX,mouseY,reticleSize,'rgba(78,205,196,.9)');
    t++;requestAnimationFrame(draw);
  }

  resize();window.addEventListener('resize',resize);
  newRound();draw();
})();
</script>
</body>
</html>
