<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geodesic Challenge — HFG</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#07070f;color:#ece8df;font-family:'JetBrains Mono',monospace;overflow:hidden;}
.game-bar{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1rem;background:#0d0d1a;border-bottom:1px solid rgba(201,168,76,.18);flex-wrap:wrap;gap:.4rem;}
.game-title{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:#c9a84c;}
.game-info{display:flex;gap:1.2rem;align-items:center;}
.game-score{font-size:.82rem;color:#c9a84c;}
.game-level{font-size:.72rem;color:#4ecdc4;}
.game-rounds{font-size:.68rem;color:#7a7570;}
.game-btn{font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;padding:.38rem .9rem;border:1px solid;cursor:pointer;transition:all .2s;}
.btn-next{border-color:#c9a84c;color:#c9a84c;background:transparent;}
.btn-next:hover{background:#c9a84c;color:#07070f;}
.btn-restart{border-color:#e84393;color:#e84393;background:transparent;}
.btn-restart:hover{background:#e84393;color:#fff;}
canvas{display:block;width:100%;cursor:none;}
.cap{padding:.5rem 1rem;font-size:.62rem;color:#7a7570;line-height:1.6;min-height:2.8rem;background:#0d0d1a;border-top:1px solid rgba(201,168,76,.1);}

/* RETICLE STAGE INDICATORS */
.stage-bar{display:flex;gap:.3rem;align-items:center;padding:.4rem 1rem;background:#07070f;border-top:1px solid rgba(201,168,76,.08);}
.stage-label{font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;color:#7a7570;margin-right:.2rem;}
.stage-pip{width:10px;height:10px;border-radius:50%;border:1px solid rgba(201,168,76,.3);background:transparent;transition:all .4s;}
.stage-pip.lit{background:#c9a84c;border-color:#ffd700;box-shadow:0 0 6px #c9a84c;}
.stage-pip.current{background:transparent;border-color:#4ecdc4;box-shadow:0 0 8px #4ecdc4;animation:pulse-pip .8s infinite;}
@keyframes pulse-pip{0%,100%{opacity:.5;}50%{opacity:1;}}

/* SCORE FLASH */
.score-flash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2.5rem;font-weight:500;pointer-events:none;opacity:0;transition:none;z-index:100;}
.score-flash.show{animation:flash-anim .8s ease-out forwards;}
@keyframes flash-anim{0%{opacity:1;transform:translate(-50%,-60%);}100%{opacity:0;transform:translate(-50%,-90%);}}

/* GAME OVER OVERLAY */
.game-over{position:absolute;inset:0;background:rgba(7,7,15,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:1rem;z-index:50;}
.game-over.show{display:flex;}
.go-title{font-size:1.4rem;color:#c9a84c;letter-spacing:.1em;}
.go-score{font-size:3rem;color:#ffd700;font-weight:500;}
.go-sub{font-size:.68rem;color:#7a7570;text-align:center;max-width:280px;line-height:1.7;}
.go-grade{font-size:1rem;color:#4ecdc4;}
</style>
</head>
<body>

<div class="game-bar">
  <span class="game-title">Geodesic Challenge</span>
  <div class="game-info">
    <span class="game-score">Score: <span id="gScore">0</span>/<span id="gTotal">0</span></span>
    <span class="game-level">Level <span id="gLevel">1</span></span>
    <span class="game-rounds">Round <span id="gRound">1</span>/20</span>
  </div>
  <div style="display:flex;gap:.4rem;">
    <button class="game-btn btn-next" id="gNew">Next Round</button>
    <button class="game-btn btn-restart" id="gRestart">Restart</button>
  </div>
</div>

<div style="position:relative;">
  <canvas id="geoGame" height="400"></canvas>
  <div class="game-over" id="gameOver">
    <div class="go-title">GAME COMPLETE</div>
    <div class="go-score" id="goScore">0 / 20</div>
    <div class="go-grade" id="goGrade">—</div>
    <div class="go-sub" id="goSub">—</div>
    <div style="display:flex;gap:.6rem;margin-top:.5rem;">
      <button class="game-btn btn-restart" id="goRestart">Play Again</button>
    </div>
  </div>
</div>

<div class="stage-bar">
  <span class="stage-label">Target size</span>
  <div class="stage-pip lit" id="pip0"></div>
  <div class="stage-pip lit" id="pip1"></div>
  <div class="stage-pip lit" id="pip2"></div>
  <div class="stage-pip lit" id="pip3"></div>
  <div class="stage-pip current" id="pip4"></div>
  <span style="font-size:.55rem;color:#7a7570;margin-left:.5rem;" id="stageLabel">Stage 1 of 5 · Large</span>
</div>

<div class="cap" id="gCap">Click where you think the geodesic — the hyperbolic straight line — passes between the two gold points.</div>

<div class="score-flash" id="scoreFlash">+1</div>

<script>
(()=>{
  const c = document.getElementById('geoGame');
  const ctx = c.getContext('2d');
  const MAX_ROUNDS = 20;
  const STAGE_NAMES = ['Huge','Large','Medium','Small','Tiny'];

  // Stage thresholds: 5 stages, each unlocked by a correct guess
  // reticleStage 0=largest, 4=smallest (stays at 4 forever after)
  // reticleRadius in normalized coords (fraction of R)
  const STAGE_RADII = [0.28, 0.20, 0.14, 0.09, 0.06];
  // Generosity multiplier per stage — hidden, slightly over-generous
  // At stage 0 threshold is already large; each stage we keep it a touch generous
  const STAGE_GENEROSITY = [1.35, 1.25, 1.18, 1.14, 1.12];

  let W, H, t = 0;
  let gP1 = null, gP2 = null, guess = null, state = 'guess';
  let score = 0, total = 0, round = 0;
  let reticleStage = 0;      // 0-4
  let mouseX = 0, mouseY = 0;

  // Audio
  let audioCtx = null;
  function initAudio(){ if(!audioCtx) audioCtx = new(window.AudioContext||window.webkitAudioContext)(); }
  function tone(freq, dur, type='sine', vol=0.15){
    if(!audioCtx) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }
  function playHit(){
    tone(523,.1,'sine',.18); 
    setTimeout(()=>tone(659,.12,'sine',.14),70);
    setTimeout(()=>tone(784,.18,'sine',.1),160);
  }
  function playMiss(){
    tone(220,.14,'sawtooth',.1);
    setTimeout(()=>tone(180,.18,'sawtooth',.07),100);
  }
  function playLevelUp(){
    tone(523,.07,'square',.1);
    setTimeout(()=>tone(659,.07,'square',.09),80);
    setTimeout(()=>tone(784,.07,'square',.08),160);
    setTimeout(()=>tone(1047,.2,'sine',.12),240);
  }
  function playNewRound(){
    tone(440,.05,'square',.07);
  }

  function resize(){ W = c.width = c.offsetWidth; H = parseInt(c.getAttribute('height')); }

  function updatePips(){
    for(let i=0;i<5;i++){
      const pip = document.getElementById('pip'+i);
      pip.classList.remove('lit','current');
      if(i < reticleStage) pip.classList.add('lit');
      else if(i === reticleStage) pip.classList.add('current');
    }
    document.getElementById('stageLabel').textContent =
      `Stage ${reticleStage+1} of 5 · ${STAGE_NAMES[reticleStage]}`;
  }

  function updateHUD(){
    document.getElementById('gScore').textContent = score;
    document.getElementById('gTotal').textContent = total;
    document.getElementById('gRound').textContent = Math.min(round+1, MAX_ROUNDS);
    document.getElementById('gLevel').textContent = reticleStage + 1;
    updatePips();
  }

  function newRound(){
    if(round >= MAX_ROUNDS){ showGameOver(); return; }
    initAudio(); playNewRound();
    state = 'guess'; guess = null;
    const a1 = Math.random()*Math.PI*2, r1 = .28+Math.random()*.48;
    const a2 = a1 + 1.1 + Math.random()*1.8, r2 = .28+Math.random()*.48;
    gP1 = [r1*Math.cos(a1), r1*Math.sin(a1)];
    gP2 = [r2*Math.cos(a2), r2*Math.sin(a2)];
    document.getElementById('gCap').textContent =
      `Round ${round+1}/20 · Stage ${reticleStage+1} · Click where the geodesic passes through.`;
    updateHUD();
  }

  function showScoreFlash(hit){
    const el = document.getElementById('scoreFlash');
    el.textContent = hit ? '+1' : '—';
    el.style.color = hit ? '#ffd700' : '#e84393';
    el.classList.remove('show');
    void el.offsetWidth; // reflow
    el.classList.add('show');
  }

  function getGrade(s){
    if(s>=18) return {grade:'S — Hyperbolic Master',sub:'You have developed genuine non-Euclidean intuition. Most mathematicians would be impressed.'};
    if(s>=15) return {grade:'A — Exceptional',sub:'Your spatial intuition has successfully recalibrated to negative curvature. Well done.'};
    if(s>=12) return {grade:'B — Strong',sub:'You have a real feel for geodesics. A few more rounds and Euclid won\'t stand a chance.'};
    if(s>=8)  return {grade:'C — Getting There',sub:'Your intuition is bending in the right direction. The geometry is starting to make sense.'};
    if(s>=5)  return {grade:'D — Euclidean Habits',sub:'Flat-space instincts are hard to shake. Try again — the shift usually happens around round 6.'};
    return {grade:'F — Pure Euclid',sub:'Don\'t worry. Nobody gets it right away. The geometry is genuinely alien. Try again.'};
  }

  function showGameOver(){
    const {grade, sub} = getGrade(score);
    document.getElementById('goScore').textContent = `${score} / ${MAX_ROUNDS}`;
    document.getElementById('goGrade').textContent = grade;
    document.getElementById('goSub').textContent = sub;
    document.getElementById('gameOver').classList.add('show');
  }

  function restart(){
    score=0; total=0; round=0; reticleStage=0;
    document.getElementById('gameOver').classList.remove('show');
    newRound();
  }

  document.getElementById('gNew').addEventListener('click', ()=>{ if(state==='reveal'){round++;newRound();} });
  document.getElementById('gRestart').addEventListener('click', restart);
  document.getElementById('goRestart').addEventListener('click', restart);

  c.addEventListener('mousemove', e=>{
    const rect=c.getBoundingClientRect();
    mouseX=(e.clientX-rect.left)*(W/rect.width);
    mouseY=(e.clientY-rect.top)*(H/rect.height);
  });

  // Get geodesic midpoint (approximate control point of the arc)
  function getArcMid(p1, p2, cx, cy, R){
    const ax=cx+p1[0]*R, ay=cy+p1[1]*R;
    const bx=cx+p2[0]*R, by=cy+p2[1]*R;
    const mx=(ax+bx)/2, my=(ay+by)/2;
    const dx=mx-cx, dy=my-cy;
    return { cpx: mx-dx*.4, cpy: my-dy*.4 };
  }

  function drawArc(p1, p2, color, width, cx, cy, R){
    const ax=cx+p1[0]*R, ay=cy+p1[1]*R;
    const bx=cx+p2[0]*R, by=cy+p2[1]*R;
    const {cpx,cpy} = getArcMid(p1, p2, cx, cy, R);
    ctx.beginPath(); ctx.moveTo(ax,ay);
    ctx.quadraticCurveTo(cpx,cpy,bx,by);
    ctx.strokeStyle=color; ctx.lineWidth=width; ctx.stroke();
  }

  function drawReticle(x, y, radius, color){
    const s = radius;
    ctx.strokeStyle=color; ctx.lineWidth=1.5;
    // Outer circle
    ctx.beginPath(); ctx.arc(x,y,s,0,Math.PI*2); ctx.stroke();
    // Inner dot circle
    ctx.beginPath(); ctx.arc(x,y,s*.3,0,Math.PI*2); ctx.stroke();
    // Crosshairs with gap
    const gap=s*.18;
    ctx.beginPath();
    ctx.moveTo(x-s*1.35,y); ctx.lineTo(x-gap,y);
    ctx.moveTo(x+gap,y);    ctx.lineTo(x+s*1.35,y);
    ctx.moveTo(x,y-s*1.35); ctx.lineTo(x,y-gap);
    ctx.moveTo(x,y+gap);    ctx.lineTo(x,y+s*1.35);
    ctx.stroke();
    // Diagonal ticks
    for(let i=0;i<4;i++){
      const a=i*Math.PI/2+Math.PI/4;
      ctx.beginPath();
      ctx.moveTo(x+s*.72*Math.cos(a), y+s*.72*Math.sin(a));
      ctx.lineTo(x+s*.96*Math.cos(a), y+s*.96*Math.sin(a));
      ctx.stroke();
    }
    // Pulse ring
    const pulse = 0.88+0.12*Math.sin(t*.12);
    ctx.beginPath(); ctx.arc(x,y,s*1.55*pulse,0,Math.PI*2);
    ctx.strokeStyle=color.replace('rgba(','rgba(').replace(/,[^,)]+\)$/,`,.12)`);
    ctx.lineWidth=.8; ctx.stroke();
  }

  c.addEventListener('click', e=>{
    if(state!=='guess') return;
    initAudio();
    const rect=c.getBoundingClientRect(), cx=W/2, cy=H/2, R=Math.min(W,H)*.44;
    const mx=((e.clientX-rect.left)*(W/rect.width)-cx)/R;
    const my=((e.clientY-rect.top)*(H/rect.height)-cy)/R;
    if(mx*mx+my*my>=.93) return;

    guess=[mx,my]; state='reveal'; total++;

    // Compute geodesic arc midpoint (the control point)
    const {cpx,cpy} = getArcMid(gP1,gP2,cx,cy,R);
    const gMidX=(cpx-cx)/R, gMidY=(cpy-cy)/R;
    const dist=Math.sqrt((mx-gMidX)**2+(my-gMidY)**2);

    // Threshold: stage radius * generosity factor
    const threshold = STAGE_RADII[reticleStage] * STAGE_GENEROSITY[reticleStage];
    const hit = dist < threshold;

    if(hit){
      score++;
      playHit();
      showScoreFlash(true);
      // Advance stage only on correct guess, max stage 4
      if(reticleStage < 4){
        reticleStage++;
        playLevelUp();
      }
      document.getElementById('gCap').textContent =
        reticleStage < 4
          ? `✓ Hit! Target shrinks next round. Score: ${score}/${total} · Click "Next Round"`
          : `✓ Hit! You've reached maximum difficulty. Score: ${score}/${total} · Click "Next Round"`;
    } else {
      playMiss();
      showScoreFlash(false);
      document.getElementById('gCap').textContent =
        `The geodesic curves more toward center than Euclidean instinct suggests. Score: ${score}/${total} · Click "Next Round"`;
    }
    updateHUD();
  });

  function draw(){
    ctx.clearRect(0,0,W,H);
    const cx=W/2, cy=H/2, R=Math.min(W,H)*.44;

    // Background
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R);
    g.addColorStop(0,'rgba(10,10,25,1)'); g.addColorStop(1,'rgba(4,4,10,1)');
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();

    // Grid lines
    for(let i=0;i<10;i++){
      const a=i*Math.PI/5+t*.0008;
      ctx.beginPath();
      ctx.moveTo(cx+R*.98*Math.cos(a), cy+R*.98*Math.sin(a));
      ctx.lineTo(cx-R*.98*Math.cos(a), cy-R*.98*Math.sin(a));
      ctx.strokeStyle='rgba(201,168,76,.055)'; ctx.lineWidth=.5; ctx.stroke();
    }

    // Boundary
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.strokeStyle='rgba(201,168,76,.4)'; ctx.lineWidth=1.5; ctx.stroke();

    if(gP1 && gP2){
      // Euclidean straight line hint (very faint)
      ctx.beginPath();
      ctx.moveTo(cx+gP1[0]*R, cy+gP1[1]*R);
      ctx.lineTo(cx+gP2[0]*R, cy+gP2[1]*R);
      ctx.strokeStyle='rgba(255,255,255,.07)';
      ctx.lineWidth=1; ctx.setLineDash([3,5]); ctx.stroke(); ctx.setLineDash([]);

      // Gold points
      [gP1,gP2].forEach(p=>{
        ctx.beginPath(); ctx.arc(cx+p[0]*R, cy+p[1]*R, 9, 0, Math.PI*2);
        ctx.fillStyle='#c9a84c'; ctx.fill();
        ctx.strokeStyle='#ffd700'; ctx.lineWidth=2; ctx.stroke();
      });

      if(state==='reveal'){
        // True geodesic
        drawArc(gP1,gP2,'rgba(78,205,196,.95)',2.5,cx,cy,R);
        ctx.fillStyle='rgba(78,205,196,.7)'; ctx.font='11px JetBrains Mono,monospace';
        ctx.fillText('geodesic',cx+8,cy-18);

        // Guess marker
        if(guess){
          ctx.beginPath(); ctx.arc(cx+guess[0]*R, cy+guess[1]*R, 7, 0, Math.PI*2);
          ctx.fillStyle='#e84393'; ctx.fill();
          ctx.fillStyle='#e84393'; ctx.font='11px JetBrains Mono,monospace';
          ctx.fillText('your guess', cx+guess[0]*R+10, cy+guess[1]*R-6);
        }
      }
    }

    // Stage + round info bottom left
    ctx.fillStyle='rgba(201,168,76,.35)';
    ctx.font='10px JetBrains Mono,monospace';
    ctx.fillText(`LVL ${reticleStage+1}  ·  ${STAGE_NAMES[reticleStage]}  ·  Round ${Math.min(round+1,MAX_ROUNDS)}/20`, 12, H-12);

    // Reticle cursor (only during guess phase)
    if(state==='guess'){
      const reticleR = STAGE_RADII[reticleStage] * R;
      const stageColors = [
        'rgba(201,168,76,.9)',   // Stage 1 gold
        'rgba(78,205,196,.9)',   // Stage 2 cyan
        'rgba(80,250,123,.9)',   // Stage 3 green
        'rgba(255,150,50,.9)',   // Stage 4 orange
        'rgba(232,67,147,.9)',   // Stage 5 rose
      ];
      drawReticle(mouseX, mouseY, reticleR, stageColors[reticleStage]);
    }

    t++; requestAnimationFrame(draw);
  }

  resize(); window.addEventListener('resize', ()=>{ resize(); });
  newRound(); draw();
})();
</script>
</body>
</html>
