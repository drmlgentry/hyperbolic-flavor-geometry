<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
<defs>
  <clipPath id="diskLF"><circle cx="200" cy="185" r="155"/></clipPath>
</defs>

<!-- Light background — inverse of HFG -->
<rect width="400" height="400" rx="12" fill="#f7f4ef"/>
<circle cx="200" cy="185" r="155" fill="#ece8df"/>

<!-- Geodesic arcs — dark family 1 -->
<g clip-path="url(#diskLF)" stroke="#1a1a2e" stroke-width="1.4" fill="none">
  <path d="M 77 107 Q 200 178 323 107" opacity="0.45"/>
  <path d="M 77 263 Q 200 192 323 263" opacity="0.45"/>
  <path d="M 107 54 Q 178 185 107 316" opacity="0.38"/>
  <path d="M 293 54 Q 222 185 293 316" opacity="0.38"/>
  <path d="M 45 185 Q 168 158 200 30" opacity="0.33"/>
  <path d="M 355 185 Q 232 212 200 340" opacity="0.33"/>
  <path d="M 45 185 Q 168 212 200 340" opacity="0.28"/>
  <path d="M 355 185 Q 232 158 200 30" opacity="0.28"/>
</g>

<!-- Lattice grid — distinctive LatticeFit element -->
<g clip-path="url(#diskLF)" stroke="#8b5e00" stroke-width="0.7" fill="none" opacity="0.4">
  <line x1="152" y1="60" x2="152" y2="310"/>
  <line x1="176" y1="40" x2="176" y2="330"/>
  <line x1="200" y1="30" x2="200" y2="340"/>
  <line x1="224" y1="40" x2="224" y2="330"/>
  <line x1="248" y1="60" x2="248" y2="310"/>
  <line x1="45" y1="161" x2="355" y2="161"/>
  <line x1="45" y1="185" x2="355" y2="185"/>
  <line x1="45" y1="209" x2="355" y2="209"/>
</g>

<!-- φ-spaced orbit dots: same positions as HFG but dark -->
<circle cx="230" cy="124" r="7" fill="#1a1a2e"/>
<circle cx="155" cy="235" r="7" fill="#3a2a00"/>
<circle cx="253" cy="175" r="7" fill="#1a1a2e" opacity="0.7"/>

<!-- Orbit triangle arcs dark -->
<g stroke="#1a1a2e" stroke-width="1.1" fill="none" opacity="0.4">
  <path d="M 230 124 Q 192 148 155 235"/>
  <path d="M 155 235 Q 204 205 253 175"/>
  <path d="M 253 175 Q 241 149 230 124"/>
</g>

<!-- Boundary circle dark -->
<circle cx="200" cy="185" r="155" stroke="#1a1a2e" stroke-width="1.8" fill="none" opacity="0.35"/>

<!-- Wordmark dark -->
<text x="200" y="364" text-anchor="middle"
  font-family="JetBrains Mono, Courier New, monospace"
  font-size="22" font-weight="500" fill="#1a1a2e" letter-spacing="4">LatticeFit</text>
<text x="200" y="383" text-anchor="middle"
  font-family="JetBrains Mono, Courier New, monospace"
  font-size="9" fill="#7a7570" letter-spacing="3">HYPERBOLIC SCAN TOOLKIT</text>

<!-- version -->
<text x="200" y="350" text-anchor="middle"
  font-family="JetBrains Mono, Courier New, monospace"
  font-size="9" fill="#8b5e00" opacity="0.7">v0.3.1 · PyPI</text>
</svg>
